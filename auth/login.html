<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login — Portfolio Platform</title>
  <meta name="robots" content="noindex" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/assets/css/auth.css" />
</head>
<body>

  <!-- Brand bar -->
  <nav class="brand-bar">
    <a href="/" class="brand-logo">⚡ PORTFOLIO PLATFORM</a>
    <a href="/" class="brand-back">← Back to portfolio</a>
  </nav>

  <!-- Toast container -->
  <div class="toast-container"></div>

  <div class="auth-wrapper">
    <div class="auth-card">

      <div class="auth-card-header">
        <div class="auth-icon">🔑</div>
        <h1 class="auth-title">Welcome back</h1>
        <p class="auth-subtitle">Sign in to your account to continue</p>
      </div>

      <form id="loginForm" novalidate>

        <div class="form-group">
          <label for="login">Email or Username</label>
          <div class="input-wrap">
            <span class="input-icon">👤</span>
            <input type="text" id="login" name="login" autocomplete="username"
                   placeholder="you@example.com or @username" required />
          </div>
          <span class="field-error"></span>
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <div class="input-wrap">
            <span class="input-icon">🔒</span>
            <input type="password" id="password" name="password" autocomplete="current-password"
                   placeholder="Your password" required />
            <button type="button" class="toggle-pw" aria-label="Show/hide password">👁️</button>
          </div>
          <span class="field-error"></span>
        </div>

        <div class="auth-links mb-0" style="margin-bottom:20px">
          <label class="checkbox-group" style="margin:0">
            <input type="checkbox" name="rememberMe" />
            <span>Remember me</span>
          </label>
          <a href="/auth/forgot-password.html">Forgot password?</a>
        </div>

        <button type="submit" class="btn-auth">
          <span class="btn-text">Sign In</span>
          <span class="btn-spinner"><span class="spinner"></span></span>
        </button>

      </form>

      <div class="auth-divider">or</div>

      <div class="auth-footer">
        Don't have an account?
        <a href="/auth/register.html">Create one — it's free</a>
      </div>

    </div>
  </div>

  <script src="/assets/js/auth.js"></script>
</body>
</html>
