<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reset Password — Portfolio Platform</title>
  <meta name="robots" content="noindex" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/assets/css/auth.css" />
</head>
<body>

  <nav class="brand-bar">
    <a href="/" class="brand-logo">⚡ PORTFOLIO PLATFORM</a>
    <a href="/auth/login.html" class="brand-back">← Back to login</a>
  </nav>

  <div class="toast-container"></div>

  <div class="auth-wrapper">
    <div class="auth-card">

      <div class="auth-card-header">
        <div class="auth-icon">🛡️</div>
        <h1 class="auth-title">Set new password</h1>
        <p class="auth-subtitle">Choose a strong password for your account</p>
      </div>

      <form id="resetForm" novalidate>
        <input type="hidden" id="resetToken" name="token" />

        <div class="form-group">
          <label for="password">New Password</label>
          <div class="input-wrap">
            <span class="input-icon">🔒</span>
            <input type="password" id="password" name="password" autocomplete="new-password"
                   placeholder="Min 8 characters" required />
            <button type="button" class="toggle-pw" aria-label="Show/hide password">👁️</button>
          </div>
          <div class="pw-strength">
            <div class="pw-strength-bar"><div class="pw-strength-fill"></div></div>
            <div class="pw-strength-text"></div>
          </div>
          <span class="field-error"></span>
        </div>

        <div class="form-group">
          <label for="confirmPassword">Confirm New Password</label>
          <div class="input-wrap">
            <span class="input-icon">🔒</span>
            <input type="password" id="confirmPassword" name="confirmPassword" autocomplete="new-password"
                   placeholder="Repeat your password" required />
            <button type="button" class="toggle-pw" aria-label="Show/hide password">👁️</button>
          </div>
          <span class="field-error"></span>
        </div>

        <button type="submit" class="btn-auth">
          <span class="btn-text">Reset Password</span>
          <span class="btn-spinner"><span class="spinner"></span></span>
        </button>
      </form>

      <!-- Done state -->
      <div id="resetDone" style="display:none" class="status-card">
        <span class="status-icon">✅</span>
        <h2>Password reset!</h2>
        <p>Your password has been changed successfully. All other sessions have been logged out.</p>
        <a href="/auth/login.html" class="btn-auth" style="display:inline-flex;text-decoration:none;margin-top:16px">
          Sign In Now
        </a>
      </div>

    </div>
  </div>

  <script src="/assets/js/auth.js"></script>
</body>
</html>
