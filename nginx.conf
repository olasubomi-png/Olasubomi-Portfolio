# ============================================================
# Nginx Site Configuration — Olasubomi Portfolio
# Target  : Ubuntu 22.04 LTS, Nginx 1.18+
# Root    : /var/www/html        (static frontend)
# Backend : http://127.0.0.1:3000 (Node.js / Express via PM2)
#
# Deployment:
#   sudo cp nginx.conf /etc/nginx/sites-available/default
#   sudo nginx -t
#   sudo systemctl reload nginx
#
# This config serves HTTP on port 80 only.
# See the "ENABLING HTTPS LATER" section at the bottom
# for instructions to add Let's Encrypt SSL when ready.
# ============================================================


# ── Gzip compression ──────────────────────────────────────
# These directives live inside the http{} context because
# Ubuntu includes site configs from within /etc/nginx/nginx.conf.
gzip              on;
gzip_vary         on;
gzip_proxied      any;
gzip_comp_level   5;
gzip_buffers      16 8k;
gzip_types
    text/plain
    text/css
    text/javascript
    application/javascript
    application/json
    application/xml
    image/svg+xml
    font/woff
    font/woff2;
gzip_min_length   1024;


# ── HTTP server (port 80) ─────────────────────────────────
server {
    listen 80 default_server;
    listen [::]:80 default_server;

    # Accept bare IP during initial setup.
    # Uncomment and set your domain once DNS is pointed here:
    # server_name yourdomain.com www.yourdomain.com;
    server_name _;

    # ── Document root ──────────────────────────────────────
    root  /var/www/html;
    index index.html;

    # ── Logging ────────────────────────────────────────────
    access_log /var/log/nginx/portfolio-access.log;
    error_log  /var/log/nginx/portfolio-error.log warn;

    # ── Security headers ───────────────────────────────────
    add_header X-Frame-Options         "SAMEORIGIN"                      always;
    add_header X-Content-Type-Options  "nosniff"                         always;
    add_header X-XSS-Protection        "1; mode=block"                   always;
    add_header Referrer-Policy         "strict-origin-when-cross-origin" always;

    # ── Well-known static files ────────────────────────────
    location = /robots.txt {
        access_log off;
        add_header Cache-Control "public, max-age=86400";
    }

    location = /sitemap.xml {
        access_log off;
        add_header Cache-Control "public, max-age=86400";
    }

    location = /favicon.svg {
        access_log off;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # ── Long-lived cache for versioned static assets ───────
    # CSS/JS filenames must change when content changes
    # (cache-busting) for browsers to pick up updates.
    location ~* \.(css|js|svg|png|jpg|jpeg|gif|webp|ico|woff|woff2|ttf|otf)$ {
        expires    1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ── API: reverse-proxy to Express on port 3000 ─────────
    location /api/ {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;

        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Disable connection keep-alive upgrade headers for plain HTTP
        proxy_set_header   Connection        "";

        # Timeouts (adjust if your API has long-running operations)
        proxy_connect_timeout  10s;
        proxy_send_timeout     30s;
        proxy_read_timeout     30s;

        # Do not buffer API responses (better for streaming / SSE)
        proxy_buffering off;
    }

    # ── SPA fallback ───────────────────────────────────────
    # Serves index.html for all client-side routes that are
    # not real files or directories on disk.
    location / {
        try_files $uri $uri/ /index.html;
    }
}


# ══════════════════════════════════════════════════════════
# ENABLING HTTPS LATER (Let's Encrypt)
# ══════════════════════════════════════════════════════════
#
# Prerequisites:
#   - A domain name pointing (A record) to this server's IP
#   - Port 443 open in your EC2 Security Group
#
# Steps:
#
#   1. Install certbot:
#        sudo apt install -y certbot python3-certbot-nginx
#
#   2. Obtain a certificate (certbot edits this file automatically):
#        sudo certbot --nginx -d yourdomain.com -d www.yourdomain.com
#
#   3. Certbot will:
#        - Add ssl_certificate / ssl_certificate_key lines
#        - Add an HTTP → HTTPS redirect block
#        - Configure auto-renewal via a systemd timer
#
#   4. Reload Nginx after certbot finishes:
#        sudo systemctl reload nginx
#
#   5. Test auto-renewal:
#        sudo certbot renew --dry-run
#
# ══════════════════════════════════════════════════════════
