# ============================================================
# Nginx Site Configuration — Olasubomi Portfolio
# File:   /etc/nginx/sites-available/portfolio
# Symlink: ln -s /etc/nginx/sites-available/portfolio \
#                /etc/nginx/sites-enabled/portfolio
#
# Replace every occurrence of "yourdomain.com" with your real domain.
# After editing:  sudo nginx -t && sudo systemctl reload nginx
# Get SSL cert:   sudo certbot --nginx -d yourdomain.com -d www.yourdomain.com
# ============================================================

# Redirect bare HTTP → HTTPS (certbot will manage this block)
server {
    listen 80;
    listen [::]:80;
    server_name yourdomain.com www.yourdomain.com;

    # certbot will insert its ACME challenge location here
    location / {
        return 301 https://$host$request_uri;
    }
}

# Main HTTPS server block
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name yourdomain.com www.yourdomain.com;

    # --- SSL (managed by certbot) ---
    ssl_certificate     /etc/letsencrypt/live/yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yourdomain.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # --- Security headers (in addition to Helmet in Node) ---
    add_header X-Frame-Options        "SAMEORIGIN"   always;
    add_header X-Content-Type-Options "nosniff"      always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;

    # --- Logging ---
    access_log /var/log/nginx/portfolio-access.log;
    error_log  /var/log/nginx/portfolio-error.log;

    # --- Root: serve frontend static files directly via Nginx ---
    root  /var/www/portfolio;   # path to your cloned repo root
    index index.html;

    # Serve robots.txt and sitemap.xml directly (no cache-busting needed)
    location = /robots.txt  { access_log off; }
    location = /sitemap.xml { access_log off; }

    # Serve favicon directly
    location = /favicon.svg { access_log off; expires 30d; }

    # Static assets (CSS, JS, images) — long cache, immutable
    location ~* \.(css|js|svg|png|jpg|jpeg|gif|webp|woff2?|ttf|ico)$ {
        expires     1y;
        add_header  Cache-Control "public, immutable";
        access_log  off;
    }

    # --- API: proxy to Express.js on port 3000 ---
    location /api/ {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection 'upgrade';
        proxy_set_header   Host       $host;
        proxy_set_header   X-Real-IP  $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # Timeouts
        proxy_connect_timeout  10s;
        proxy_send_timeout     30s;
        proxy_read_timeout     30s;
    }

    # --- SPA fallback: serve index.html for all non-file routes ---
    location / {
        try_files $uri $uri/ /index.html;
    }
}
